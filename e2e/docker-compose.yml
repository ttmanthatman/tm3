services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tm3_e2e
      MYSQL_USER: tm3_e2e
      MYSQL_PASSWORD: tm3_e2e
      MYSQL_ROOT_PASSWORD: tm3_e2e_root
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -ptm3_e2e_root --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
